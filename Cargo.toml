[package]
name = "farlink"
version = "0.1.1"
edition = "2024"
description = "Farlink: self-hosted remote desktop (viewer, relay server with web admin, and host helper)"
default-run = "farlink"

[lib]
name = "farlink"
path = "src/lib.rs"

# Desktop viewer (egui) - the app you use to see and control machines.
[[bin]]
name = "farlink"
path = "src/main.rs"

# Relay + web admin + install links + update server.
[[bin]]
name = "farlink-server"
path = "src/bin/farlink-server.rs"

# Helper installed on every remote machine (controllable only).
[[bin]]
name = "farlink-host"
path = "src/bin/farlink-host.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
env_logger = "0.11.11"
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
png = "0.18"
rand = "0.10.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "tls12", "webpki-roots", "tokio"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "process", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.5.1", features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["randr", "xtest", "xfixes", "damage"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_Security", "Win32_UI_HiDpi", "Win32_System_StationsAndDesktops", "Win32_System_Environment", "Win32_System_LibraryLoader"] }

# Small, fast development builds (this machine has little free disk).
[profile.dev]
opt-level = 1
debug = false
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
